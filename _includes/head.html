{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 临时测试：强制显示语言切换按钮 -->
<div style="position: absolute; top: 1rem; right: 2rem; z-index: 999; background: red; padding: 0.5rem;">
  {% assign current_lang = page.lang | default: "en" %}
  {% if current_lang == "en" %}
    <a href="/life-cn/" style="color: white;">中文</a>
  {% else %}
    <a href="/life/" style="color: white;">English</a>
  {% endif %}
</div>

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
